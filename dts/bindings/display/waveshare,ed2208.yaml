description: Waveshare ED2208 800x480 color e-paper display controller

compatible: "waveshare,ed2208"

include: [mipi-dbi-spi-device.yaml, display-controller.yaml]

properties:
  busy-gpios:
    type: phandle-array
    required: true
    description: BUSY pin.

      The BUSY pin of ED2208 is active low.
      If connected directly the MCU pin should be configured
      as active low.